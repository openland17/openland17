<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320"
     font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace"
     role="img"
     aria-label="CamoNet training run: train and validation loss across 15 epochs of DINOv2-base fine-tuning. Best checkpoint at epoch 10 with validation loss 0.78. Final top-1 accuracy 0.738, top-3 0.921.">
  <style>
    .grid { stroke: #d8dee4; stroke-width: 0.5; }
    .axis { stroke: #afb8c1; stroke-width: 1; }
    .train { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .val { stroke: #cf222e; stroke-width: 1.8; fill: none; stroke-dasharray: 5 3; }
    .marker { fill: #1a7f37; stroke: #1a7f37; }
    .markerline { stroke: #1a7f37; stroke-width: 0.7; stroke-dasharray: 2 3; opacity: 0.65; fill: none; }
    .label { fill: #656d76; font-size: 11px; }
    .title { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .meta { fill: #656d76; font-size: 11px; }
    .stat { fill: #1f2328; font-size: 11px; font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      .grid { stroke: #30363d; }
      .axis { stroke: #484f58; }
      .train { stroke: #58a6ff; }
      .val { stroke: #ff7b72; }
      .marker { fill: #3fb950; stroke: #3fb950; }
      .markerline { stroke: #3fb950; }
      .label { fill: #8b949e; }
      .title { fill: #e6edf3; }
      .meta { fill: #8b949e; }
      .stat { fill: #e6edf3; }
    }
  </style>

  <!-- Header -->
  <text x="70" y="22" class="title">training run · camonet · dinov2-base</text>
  <text x="850" y="22" text-anchor="end" class="meta">2 400 imgs · 40 cls · bf16 · 15 epochs</text>

  <!-- Plot axes -->
  <line x1="70" y1="50" x2="70" y2="270" class="axis"/>
  <line x1="70" y1="270" x2="850" y2="270" class="axis"/>

  <!-- Horizontal gridlines (loss = 1, 2, 3, 4) -->
  <line x1="70" y1="50"  x2="850" y2="50"  class="grid"/>
  <line x1="70" y1="105" x2="850" y2="105" class="grid"/>
  <line x1="70" y1="160" x2="850" y2="160" class="grid"/>
  <line x1="70" y1="215" x2="850" y2="215" class="grid"/>

  <!-- Y-axis tick labels -->
  <text x="62" y="54"  text-anchor="end" class="label">4.0</text>
  <text x="62" y="109" text-anchor="end" class="label">3.0</text>
  <text x="62" y="164" text-anchor="end" class="label">2.0</text>
  <text x="62" y="219" text-anchor="end" class="label">1.0</text>
  <text x="62" y="274" text-anchor="end" class="label">0.0</text>

  <!-- X-axis ticks + labels (every 2 epochs) -->
  <line x1="70"    y1="270" x2="70"    y2="273" class="axis"/>
  <text x="70"    y="285" text-anchor="middle" class="label">0</text>
  <line x1="181.4" y1="270" x2="181.4" y2="273" class="axis"/>
  <text x="181.4" y="285" text-anchor="middle" class="label">2</text>
  <line x1="292.9" y1="270" x2="292.9" y2="273" class="axis"/>
  <text x="292.9" y="285" text-anchor="middle" class="label">4</text>
  <line x1="404.3" y1="270" x2="404.3" y2="273" class="axis"/>
  <text x="404.3" y="285" text-anchor="middle" class="label">6</text>
  <line x1="515.7" y1="270" x2="515.7" y2="273" class="axis"/>
  <text x="515.7" y="285" text-anchor="middle" class="label">8</text>
  <line x1="627.1" y1="270" x2="627.1" y2="273" class="axis"/>
  <text x="627.1" y="285" text-anchor="middle" class="label">10</text>
  <line x1="738.6" y1="270" x2="738.6" y2="273" class="axis"/>
  <text x="738.6" y="285" text-anchor="middle" class="label">12</text>
  <line x1="850"   y1="270" x2="850"   y2="273" class="axis"/>
  <text x="850"   y="285" text-anchor="middle" class="label">14</text>

  <text x="460" y="304" text-anchor="middle" class="label">epoch</text>

  <!-- Y-axis title (rotated) -->
  <text x="22" y="160" text-anchor="middle" class="label" transform="rotate(-90 22 160)">loss</text>

  <!-- Best-checkpoint vertical guide -->
  <line x1="627.1" y1="227.1" x2="627.1" y2="60" class="markerline"/>

  <!-- Train loss curve -->
  <polyline class="train" points="70,83 125.7,149 181.4,187.5 237.1,212.25 292.9,227.1 348.6,237 404.3,244.7 460,250.2 515.7,254.05 571.4,256.8 627.1,259 682.9,260.65 738.6,262.3 794.3,263.4 850,263.95"/>

  <!-- Val loss curve -->
  <polyline class="val" points="70,77.5 125.7,132.5 181.4,168.25 237.1,190.25 292.9,202.9 348.6,212.25 404.3,217.75 460,221.6 515.7,224.35 571.4,226 627.1,227.1 682.9,227.1 738.6,226.55 794.3,225.45 850,224.35"/>

  <!-- Best checkpoint marker -->
  <circle cx="627.1" cy="227.1" r="3.5" class="marker"/>
  <text x="627.1" y="55" text-anchor="middle" class="stat">★ best · ep 10 · val 0.78</text>

  <!-- Legend -->
  <line x1="700" y1="78" x2="730" y2="78" class="train"/>
  <text x="736" y="82" class="label">train</text>
  <line x1="700" y1="98" x2="730" y2="98" class="val"/>
  <text x="736" y="102" class="label">val</text>

  <!-- Final metrics -->
  <text x="850" y="318" text-anchor="end" class="stat">top-1 · 0.738    top-3 · 0.921    macro-f1 · 0.71</text>
</svg>
